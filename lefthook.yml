glob_matcher: doublestar

pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{js,ts,jsx,tsx,json,css,md}'
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    lint:fsd:
      run: bun run lint:fsd
    forbid-foreign-lockfiles:
      glob: '**/{package-lock.json,yarn.lock,pnpm-lock.yaml}'
      run: exit 1
      fail_text: 'Detectado lockfile de outro gerenciador de pacotes. Use bun.lockb/bun.lock (bun install).'

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit

pre-push:
  commands:
    test:
      run: bun run test
