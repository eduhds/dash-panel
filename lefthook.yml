pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{js,ts,jsx,tsx,json,css,md}'
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    lint:fsd:
      run: bun run lint:fsd

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit

pre-push:
  commands:
    test:
      run: bun run test
