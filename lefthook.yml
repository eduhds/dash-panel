pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,ts,jsx,tsx,json,css,md}'
      run: npx prettier --write {staged_files}
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: npx oxlint --fix {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit
